<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Travelora — Tourism Information Retrieval System</title><script>
(() => {
  if (!window.location.search.startsWith('?/')) return;
  const [route, ...queryParts] = window.location.search.slice(2).split('&');
  const query = queryParts.join('&');
  const base = '%BASE_URL%';
  window.history.replaceState(null, '', `${base}${route}${query ? `?${query}` : ''}${window.location.hash}`);
})();
</script></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
